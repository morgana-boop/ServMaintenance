name: Daily Heartbeat

on:
  schedule:
    - cron: "17 12 * * *"
      timezone: "America/Fortaleza"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt

      - name: Commit changes
        run: |
          git config user.name "Morgana"
          git config user.email "268062531+morgana-boop@users.noreply.github.com"

          git add heartbeat.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: daily maintenance"
          git push
